<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="home_style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" type="image/png" href="piyuLogo.png"> 
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />

    <title>Home | PiyuHub</title>
    <script>
        let userData; 
        let updateInterval;

        document.addEventListener("DOMContentLoaded", function() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (!isLoggedIn) {
    
            } else {
                const userDataString = localStorage.getItem('userData');
                if (userDataString) {
                    userData = JSON.parse(userDataString);
                    fetchUserData(userData.id_no); // Use the stored ID to fetch user data
                } else {

                }
            }
        });
        
        // Fetch user data
        function fetchUserData(studentId) {
            fetch(`http://localhost/piyuhub/api/home/load_account?student_id=${studentId}&t=${new Date().getTime()}`) // Append a timestamp to prevent caching
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Update the account details with fetched user data
                        updateUIWithUserData(data.userData); // Call the new update function
                    } else {
                        console.error(data.error);
                        window.location.href = "index.html"; // Redirect if user not found
                    }
                })
                .catch(error => {
                    console.error('Error fetching user data:', error);
                    alert('An error occurred while fetching user data. Please try again.');
                });
        }
        
        // Function to update the UI with user data
        function updateUIWithUserData(data) {
            document.getElementById('student_name').textContent = `${data.fname} ${data.lname}`;
            document.getElementById('student_id').innerHTML = `<i class="fa-solid fa-id-card"></i> ${data.id_no}`;
            document.getElementById('student_college').innerHTML = `<i class="fa-solid fa-graduation-cap"></i> ${data.college}`;
            document.getElementById('student_email').innerHTML = `<i class="fa-solid fa-envelope"></i> ${data.email}`;
            document.getElementById('department').textContent = data.college;
        
            const profilePic = document.querySelector('.profile-picture');
            const userProfilePic = document.getElementById('userProfilePic');
            const pictureSrc = data.profile_picture ? data.profile_picture + '?t=' + new Date().getTime() : 'Upload/logo/profile.png';
            profilePic.src = pictureSrc;
            userProfilePic.src = pictureSrc;
        
            const concernsInput = document.getElementById('concernsInput');
            concernsInput.placeholder = `Any concerns, ${data.fname}?`;
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            // Ensure userData is defined before fetching notifications
            if (userData && userData.id) {
                fetchNotifications(); // Initial fetch of notifications
                // Set up interval to fetch notifications every 10 seconds
                setInterval(fetchNotifications, 10000); // Adjust time as needed
            } else {
                console.error('User data is not defined. Please check user login status.');
            }
        
            // Retrieve notification count from localStorage
            const notificationCount = localStorage.getItem('notificationCount') || 0; // Default to 0 if not found
            const notificationCountElement = document.getElementById('notificationCount');
        
            if (notificationCountElement) {
                notificationCountElement.textContent = notificationCount; // Update notification count display
            }
        });
        
        function fetchNotifications() {
            fetch(`http://localhost/piyuhub/api/home/get_notifications?user_id=${userData.id}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok ' + response.statusText);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('Fetched notifications:', data); // Log the fetched data
        
                    const notificationCountElement = document.getElementById('notificationCount');
                    if (notificationCountElement) {  // Ensure the element exists
                        if (Array.isArray(data)) {
                            // Update the notification count and store in localStorage
                            notificationCountElement.textContent = data.length; // Update the count
                            localStorage.setItem('notificationCount', data.length); // Store in localStorage
                        } else {
                            console.error('Unexpected data structure:', data);
                            notificationCountElement.textContent = 0; // Set default to 0
                        }
                    } else {
                        console.error('Notification count element not found in the DOM.');
                    }
                })
                .catch(error => console.error('Error fetching notifications:', error));
        }
        
    </script>
    
</head>

<body>
    

    <!-- Left Section -->
    <div id="left">
        <div class="account-details">
            <img alt="Profile Picture" class="profile-picture" src="Upload/logo/profile.png"><br>
            <button id="uploadButton" class="custom-button" >
            <label for="fileInput" title="Change Photo">Change Photo</label>
            </button>
            <input type="file" id="fileInput" class="file-input" style="display: none;" accept="image/*"/>
            <h2 class="student_name" id="student_name">Name here</h2>
            <p class="student_id" id="student_id"><i class="fa-solid fa-id-card"></i> 0422-0000</p>
            <p class="student_college" id="student_college"><i class="fa-solid fa-graduation-cap"></i> BSCS</p>
            <p class="student_email" id="student_email"><i class="fa-solid fa-envelope"></i> johndoe@example.com</p>
            <a href="change_email_auth.html"> <button class="btn"> Change Email</button></a>
            <a href="change_password.html"><button class="btn">Change Password</button></a>
            <button class="btn logout">Logout</button>
        </div>        
    </div>
    <!-- Middle Section -->
    <div id="middle">
        <div class="posting">
            <button><a href="post.html" class="tab active" onclick="changeTab(this, 'posts')">POST</a></button>
            <button>
                <a href="ccs.html" class="tab" onclick="changeTab(this, 'ccs')" id="department">COLLEGE</a>
            </button>            
            <button><a href="lost.html" class="tab" onclick="changeTab(this, 'lost-found')">LOST & FOUND</a></button>
        </div>
        <!-- Posting Section -->
        <div class="form-container fade-in">
            <form method="post" enctype="multipart/form-data">
                <div class="p-icon">
                    <div class="icon">
                        <img id="userProfilePic" src="Upload/logo/profile.png" alt="User Icon" width="40px"> 
                    </div>
                    
                    <div class="input-group">  
                        <input type="text" id="concernsInput" name="concerns" placeholder="Any concerns?" class="text-input" readonly>
                    </div>
                </div>
                
            </form> 
        </div>
    <!-- Top Section -->
    <div id="overlay" class="overlay"></div>
    <div id="top">
        <div class="logo-container">
            <img src="Upload/logo/Piyulogo.png" alt="Logo" class="logo">
                <span class="site-name">PiyuHub</span>
        </div>
        
        
        <div class="icon-bar" id="icon-bar">
            <i class="fa-solid fa-user" id="user-icon"></i>
            <i class="fa-solid fa-xmark" id="close-icon" style="display: none;"></i> <!-- Close icon -->
            <i class="fa-solid fa-bars" id="menu-icon"></i>
        </div>
        
    </div>


        

        <div id="postsContainer"></div>

        <!-- Fullscreen Modal -->
        <div id="fullscreenModal" style="display: none;">
            <span id="closeModal" style="cursor: pointer;">&times;</span>
            <img id="fullscreenImage" src="" alt="Full Screen Image" />
        </div>
        
        
    </div>

       <!-- Upload Modal -->
        <div id="uploadModal" class="upload-modal"> <!-- Initially hidden -->
            <div class="upload-modal-content">
                <h3>Preview Your Profile Picture</h3>
                <div class="pic-preview">
                <img id="imagePreviewModal" style="max-width: 200px; margin-bottom: 10px; font-size:12px; border-radius:50%;"><br>
                </div>
                <p class="error-message" id="upload-error-message"></p> <!-- Error message element -->
                <div class="upload-input">
                    <label for="fileInput" title="Upload Photo"><i class="fa-solid fa-upload"></i></label>
                    <input type="file" id="fileInput" class="file-input" accept="image/*"/>
                </div>
                <button id="confirmUpload" class="btn" onclick="uploadProfilePicture()">Upload</button>
                <button id="cancelUpload" class="btn">Cancel</button>
            </div>
        </div>



    <!-- Right Section -->
    <div id="right">
        <div class="other">
            <h3>OTHER</h3>
            <a href="notif.html">
                <button class="btn">
                    <span id="notificationCount" class="notification-count">0</span> <!-- Notification count -->
                    NOTIFICATIONS
                </button>
            </a>
            <a href="contact.html"><button class="btn">CONTACT</button></a>
            <a href="games.html"><button class="btn">GAMES</button></a>
            <a href="schoolprofile.html"><button class="btn">SCHOOL PROFILE</button></a>
            <a href="about_us.html"><button class="btn">ABOUT US</button></a>
        </div>
    </div>

    <!-- Logout Confirmation Modal -->
    <div id="logoutModal" class="modal">
        <div class="modal-content">
            <p>Are you sure you want to logout?</p>
            <div class="modal-buttons">
                <button id="confirmLogout" class="btn1 confirm">Yes, Logout</button>
                <button id="cancelLogout" class="btn1 cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Modal for Posting Concerns -->
    <div id="postModal" class="modal-post" style="display:none;">
        <div class="modal-content-post">
            <h3>Post Your Concern</h3>
            <div class="post-input-group">  
                <textarea id="postInput" name="concern" placeholder="Type your concern here... (Required)" class="text-input" rows="4" style="width: 100%;" required></textarea>  
            </div>
            <div class="upload-btn">
                <label for="postImage" class="upload-label">
                    <p><i class="fa-solid fa-camera"></i> Maximum of 5 images</p>
                </label>
                <input type="file" id="postImage" class="file-input" style="display: none;" accept="image/*" multiple/>
            </div>
            <div id="imagePreviews" class="image-previews"></div>
            <div class="btn-upl">
                
                <button id="cancelPost" class="btn">Cancel</button>
                <button id="submitPost" class="btn">Post</button>
            </div>
        </div>
    </div>

    <!-- Fullscreen Image Modal -->
    <div id="fullscreenModal" class="fullscreen-modal" style="display: none;">
        <span class="close" id="closeFullscreen">&times;</span>
        <img class="fullscreen-image" id="fullscreenImage" src="" alt="Full Size Image">
    </div>

    <div id="loadingSpinner" style="display:none;">
        <div class="spinner"></div>
        <p>Posting...</p>
    </div>

      <!-- Comment Modal -->
    <div id="commentModal" class="comment-modal">
        <span id="closeCommentModal" class="close" title="Close">&times;</span>
            <h3>Comments</h3>
        <div class="comment-modal-content">
            <ul id="commentList">
                <!-- Comments will be dynamically added here -->
            </ul>        
        </div>
        <!-- Comment input form -->
        <div id="commentInputSection">
            <!-- Image Preview Section (Initially hidden) -->
            <div id="commentImagePreviewContainer" style="position: relative; display: none; text-align: right;">
                <img id="commentImagePreview">
                <span id="removeImageBtn" class="remove-image-btn">&times;</span>
            </div>
        
            <!-- Input and Buttons Wrapper -->
            <div id="commentInputWrapper" style="display: flex; align-items: center; width: 100%;">
                <!-- Textarea for comment -->
                <textarea id="commentInput" placeholder="Write your comment here..." rows="3"></textarea>
        
                <!-- Add icon to upload image -->
                <input type="file" id="commentImageInput" style="display: none;" accept="image/*">
                <label for="commentImageInput" class="upload-image-icon">
                    <i class="fa-solid fa-paperclip"></i> <!-- This is the icon for image upload -->
                </label>
        
                <!-- Submit Button -->
                <button id="submitCommentBtn" type="button"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
    <!-- Full-screen Modal for Viewing Images -->
    <div id="imageModal" class="imageModal" style="display:none;">
        <span class="imageClose" id="modalClose">&times;</span>
        <img class="image-modal-content" id="modalImage" alt="Full Size Image">
        <div id="caption"></div>
    </div>

    <div id="deletePostModal" class="delete-modal">
    <div class="delete-modal-content">
        <div class="modal-content">
            <h2>Confirm Deletion</h2>
            <p>Are you sure you want to delete this post?</p>
            <button id="confirmDeleteButton" class="btn">Yes, Delete</button>
            <button id="cancelDeleteButton" class="btn">Cancel</button>
        </div>
    </div>
    </div>

   

  
    
</body>

<script src="home_scripts.js"></script>
<script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>

</html>
