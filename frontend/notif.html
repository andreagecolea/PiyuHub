<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - PiyuHub</title>
    <link rel="stylesheet" href="notif.css">
    <!-- exclamaton point icon link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- back arrow icon link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Poppins link -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" >
 
  
 
</head>
<body>
    <!-- Header section -->
    <header class="header">
        <button class="back-arrow">
            <i class="fas fa-arrow-left"></i> 
        </button>
        
        <h1>Notifications</h1>
    </header>

    <!-- Notifications list -->
    <section class="notification-list">
        
        <!-- Sample notification 1 -->
        <div class="notification-item">
            <span class="notification-icon"><i class="fas fa-exclamation-circle"></i></span>
            <div class="notification-content">
                <div class="notification-title">Sample notification</div>
                <div class="notification-info">Info about the notification</div>
            </div>
        </div>

        <!-- Sample notification 2 -->
        <div class="notification-item">
            <span class="notification-icon"><i class="fas fa-exclamation-circle"></i>
            </span>
            <div class="notification-content">
                <div class="notification-title">Sample notification</div>
                <div class="notification-info">Info about the notification</div>
            </div>
        </div>
    </section>

    <!-- Empty state message -->
    <div class="empty-state">
        --- Nothing to see here ---
    </div>
    
</body>
</html>
