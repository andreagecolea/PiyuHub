<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us - PiyuHub</title>
    <!-- link for profile icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="message_pop.css">
    <!-- link for back arrow icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- link for Poppins -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
</head>
<body>
    <!-- Header section -->
    <header class="header">
        <span class="back-arrow"><i class="fas fa-arrow-left"></i></span>
        <h1>Message</h1>
    </header>

    <div class="whole">
        <!-- Campus members section -->
        <section class="campus_members">
            <div class="org">
                <div class="avatar"><i class="fas fa-user-circle"></i></div>
                <div class="name">OSAS</div>
                <div class="osas">
                    <a href="osas@piyuhub.com" class="contact-button">
                        <button class="contactBtn">
                        <i class="fas fa-envelope"></i> Contact
                        </button>
                    </a> 
                </div>       
            </div>
            

            <div class="org">
                <div class="avatar"><i class="fas fa-user-circle"></i></div>
                <div class="name">REGISTRAR</div>
                <div class="registrar">
                    <a href="registrar@piyuhub.com" class="contact-button">
                        <button class="contactBtn">
                            <i class="fas fa-envelope"></i> Contact
                        </button>
                    </a>
                </div>
            </div>

            <div class="org">
                <div class="avatar"><i class="fas fa-user-circle"></i></div>
                <div class="name">BAO</div>
                <div class="BAO">
                    <a href="BAO@piyuhub.com" class="contact-button">
                        <button class="contactBtn">
                            <i class="fas fa-envelope"></i> Contact
                        </button>
                    </a>
                </div>    
            </div>

            <div class="org">
                <div class="avatar"><i class="fas fa-user-circle"></i></div>
                <div class="name">CCS COUNCIL</div>
                <div class="CCS COUNCIL">
                    <a href="CCS COUNCIL@piyuhub.com" class="contact-button">
                        <button class="contactBtn">
                            <i class="fas fa-envelope"></i> Contact
                        </button>
                    </a>
                </div>
            </div>
        </section>
    </div>

    <!-- Modal Structure for Contact Form -->
    <div id="contactModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" placeholder="Provide your name" required>
                </div>
    
                <div class="form-group">
                    <label for="subject">Subject:</label>
                    <input type="text" id="subject" placeholder="Topic of your message" required>
                </div>
    
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="Provide your email" required>
                </div>
    
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" placeholder="Your message" required></textarea>
                </div>
    
                <button type="submit" class="submit-btn">Send</button>
            </form>
        </div>
    </div>
    

    <script>
        // Get the modal
        const modal = document.getElementById('contactModal');
        
        // Get the buttons that open the modal
        const contactBtns = document.querySelectorAll('.contactBtn');
        
        // Get the <span> element that closes the modal
        const closeBtn = document.querySelector('.close');
    
        // Function to open the modal
        contactBtns.forEach(button => {
            button.addEventListener('click', () => {
                modal.style.display = 'flex';
            });
        });
    
        // Function to close the modal
        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });
    
        // Close the modal when clicking outside of it
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        };
    </script>
    
</body>
</html>
