<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" >
    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <title>PiyuHub</title>

</head>
<body>
    
<div class="login-container">
    <img src="piyuLogo.png" alt="Logo" class="logo">
    <h1>Login</h1>
    <form action = "" >
        
        <div class="box"> 
            <input type="email"placeholder="Email" required>
            <i class='bx bxl-gmail gmail-icon'></i> 
        </div>
        <div class="box">  
            <input type="password"placeholder="Password" required>
            <i class='bx bx-hide' id="togglePassword"></i>
        </div>
        <div class="remember-forgot">
            <label><input type="checkbox">Remember Me</label>
            <a href="forgot.html" id="forgot-password-container">Forgot Password</a>
        </div>     
        <div>
            <button type="submit" class="login-button">Login</button>
        </div>
        <div class="register-link">
            <p>DON'T HAVE AN ACCOUNT? 
            <a href="signup.html" id="signup-container">SIGN UP</a> 
            </p>
        </div>
    </form>
</div>
<script src="login.js"></script>
</body>
</html
