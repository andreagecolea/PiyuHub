<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
   
    <title>Change Password | Change Email</title>
    <link rel="stylesheet" href="change_password.css">
</head>
<body>
    <div class="container">
        <div class="icon-container">
            <div class="arrow"><button><i class='bx bx-left-arrow-alt'></i></button></div>
             <h1 style="white-space: nowrap;">Change Password</h1>
             <img src="piyuLogo.png" alt="Logo" class="logo">
         </div> 

         <div class="oldnew">
            <div class="old_password_box">
                <input type="password" id="oldPassword" placeholder="Old password"> 
                <i class='bx bx-hide' id ="oldTogglePassword"></i> 
            </div>
        
            <div class="new_password_box">
                <input type="password" id="newPassword" placeholder="New password"> 
                <i class='bx bx-hide' id ="newTogglePassword"></i> 
            </div>
        </div>

        <div class="change_password_box">
            <button>Change Password</button> 
       
    </div>
    </div>

    <script src="change_password.js"></script>
    
</body>
</html>
